<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OBS Game</title>
<style>
body {
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:Arial Black;
    color:white;
}

#game {
    position:absolute;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:900px;
    background:rgba(0,0,0,0.75);
    padding:30px;
    border-radius:20px;
    text-align:center;
    border:3px solid gold;
}

#category {
    font-size:32px;
    color:gold;
    margin-bottom:20px;
}

#word {
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.letter {
    width:60px;
    height:70px;
    background:white;
    color:black;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    border-radius:10px;
}

.hidden {
    background:#222;
    color:#222;
}

#leaderboard {
    position:absolute;
    left:30px;
    top:30px;
    width:300px;
    background:rgba(0,0,0,0.7);
    padding:20px;
    border-radius:15px;
    border:2px solid red;
}
</style>
</head>
<body>

<div id="leaderboard">
    <b>🏆 TOP</b>
    <div id="lb"></div>
</div>

<div id="game">
    <div id="category">ожидание...</div>
    <div id="word"></div>
</div>

<script>
const WS_URL = "ws://127.0.0.1:4455/";

let ws;
let word = "";
let guessed = [];
let scores = {};
let category = "";

const WORDS = [
    ["ВОЛК","Животное: Лес"],
    ["ЛЕОПАРД","Животное: Хищник"],
    ["ЖИРАФ","Животное: Саванна"],
    ["СЛОН","Животное: Африка"],
    ["ТИГР","Животное: Хищник"]
];

function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        console.log("connected");
        startRound();
    };

    ws.onmessage = (msg) => {
        try {
            let data = JSON.parse(msg.data);

            // Streamer.bot trigger
            if (data.event === "chat") {
                handleChat(data.user, data.message);
            }
        } catch(e){}
    };

    ws.onclose = () => setTimeout(connect, 2000);
}

function startRound() {
    let w = WORDS[Math.floor(Math.random()*WORDS.length)];
    word = w[0];
    category = w[1];
    guessed = [];

    document.getElementById("category").innerText = category;
    renderWord();
}

function renderWord() {
    let div = document.getElementById("word");
    div.innerHTML = "";

    for (let c of word) {
        let el = document.createElement("div");
        el.className = "letter";

        if (!guessed.includes(c)) {
            el.classList.add("hidden");
            el.innerText = "?";
        } else {
            el.innerText = c;
        }

        div.appendChild(el);
    }
}

function handleChat(user, msg) {
    msg = msg.toUpperCase();

    if (msg.startsWith("!Б ")) {
        let l = msg.replace("!Б ","")[0];

        if (word.includes(l) && !guessed.includes(l)) {
            guessed.push(l);
            addScore(user, 10);
            renderWord();
        }
    }

    if (msg.startsWith("!СЛОВО ")) {
        let w = msg.replace("!СЛОВО ","");

        if (w === word) {
            guessed = word.split("");
            addScore(user, 50);
            renderWord();
            setTimeout(startRound, 2000);
        }
    }
}

function addScore(user, pts) {
    scores[user] = (scores[user]||0)+pts;
    updateLB();
}

function updateLB() {
    let arr = Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,10);

    document.getElementById("lb").innerHTML =
        arr.map((x,i)=>`${i+1}. ${x[0]} - ${x[1]} XP`).join("<br>");
}

connect();
</script>

</body>
</html>

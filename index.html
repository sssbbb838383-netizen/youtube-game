<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра для OBS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            text-align: center;
            background: rgba(15, 16, 28, 0.96);
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            /* Уменьшили ширину с 850px до 640px */
            width: 640px; 
        }
        #category {
            /* Немного уменьшили шрифт для компактности */
            font-size: 26px; 
            color: #ffcc00;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        #word-display {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .letter-box {
            /* Сделали плашки букв чуть меньше для компактности */
            width: 45px;
            height: 55px;
            background: #ffffff;
            color: #111111;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 0 #b3b3b3;
            text-transform: uppercase;
        }
        .hidden-letter {
            background: #252836 !important;
            color: #252836 !important;
            border: 2px solid #45495e;
            box-shadow: inset 0 0 8px #000;
        }
        #instructions {
            font-size: 15px;
            color: #00ffcc;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 8px;
        }
        #leaderboard {
            margin-top: 20px;
            font-size: 17px;
            text-align: left;
            border-top: 2px solid #333;
            padding-top: 15px;
        }
        .score-entry {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            margin: 4px 0;
            border-radius: 6px;
            border-left: 4px solid #ffcc00;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="category">Загрузка...</div>
        <div id="word-display"></div>
        <div id="instructions">💬 Команды для чата: !б [буква] или !слово [слово]</div>
        
        <div id="leaderboard">
            <div style="color: #ff4757; font-weight: bold; margin-bottom: 10px;">🏆 ТОП-10 ИГРОКОВ:</div>
            <div id="leaderboard-list">
                <div style="color: #888; font-style: italic;">Ожидание ходов зрителей...</div>
            </div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>

    <script>
        // ВСТАВЬТЕ СЮДА ID ВАШЕГО СТРИМА ПОСЛЕ НАЧАЛА СТРИМА
        const YOUTUBE_VIDEO_ID = ""; 

        const WORDS_DATABASE = [
            { word: "АРБУЗ", category: "Еда / Ягода" },
            { word: "СТРИМЕР", category: "Профессия" },
            { word: "НОУТБУК", category: "Техника" },
            { word: "КОСМОС", category: "Наука" },
            { word: "ПОДПИСЧИК", category: "Человек на стриме" },
            { word: "ТЕЛЕФОН", category: "Гаджет" },
            { word: "ФУТБОЛ", category: "Спорт" },
            { word: "ЖИРАФ", category: "Животное" }
        ];

        let currentWordObj = {};
        let guessedLetters = [];
        let scores = {};

        function initNewRound() {
            currentWordObj = WORDS_DATABASE[Math.floor(Math.random() * WORDS_DATABASE.length)];
            guessedLetters = [];
            document.getElementById("category").innerText = `Категория: ${currentWordObj.category}`;
            renderWord();
        }

        function renderWord() {
            const container = document.getElementById("word-display");
            container.innerHTML = "";

            for (let char of currentWordObj.word) {
                const box = document.createElement("div");
                box.classList.add("letter-box");

                if (guessedLetters.includes(char)) {
                    box.innerText = char;
                } else {
                    box.classList.add("hidden-letter");
                    box.innerText = "?";
                }
                container.appendChild(box);
            }
        }

        function processGameMessage(user, msg) {
            msg = msg.trim().toUpperCase();

            if (msg.startsWith("!Б ")) {
                let letter = msg.replace("!Б ", "").trim().substring(0, 1);
                if (!letter) return;

                if (currentWordObj.word.includes(letter) && !guessedLetters.includes(letter)) {
                    guessedLetters.push(letter);
                    scores[user] = (scores[user] || 0) + 10;
                    renderWord();
                    updateLeaderboard();
                    checkWin();
                }
            }

            if (msg.startsWith("!СЛОВО ")) {
                let guessedWord = msg.replace("!СЛОВО ", "").trim();
                if (guessedWord === currentWordObj.word) {
                    scores[user] = (scores[user] || 0) + 50;
                    guessedLetters = currentWordObj.word.split("");
                    renderWord();
                    updateLeaderboard();
                    
                    document.getElementById("instructions").innerText = `🎉 ${user} угадал слово целиком!`;
                    setTimeout(() => {
                        document.getElementById("instructions").innerText = "💬 Команды для чата: !б [буква] или !слово [слово]";
                        initNewRound();
                    }, 4000);
                }
            }
        }

        function checkWin() {
            let isWin = true;
            for (let char of currentWordObj.word) {
                if (!guessedLetters.includes(char)) isWin = false;
            }
            if (isWin) {
                document.getElementById("instructions").innerText = "🎉 Слово разгадано! Новый раунд...";
                setTimeout(() => {
                    document.getElementById("instructions").innerText = "💬 Команды для чата: !б [буква] или !слово [слово]";
                    initNewRound();
                }, 4000);
            }
        }

        function updateLeaderboard() {
            const list = document.getElementById("leaderboard-list");
            list.innerHTML = "";
            // Изменили slice(0, 5) на slice(0, 10), чтобы выводилось до 10 игроков
            let sorted = Object.entries(scores).sort((a, b) => b - a).slice(0, 10); 
            
            sorted.forEach(([player, score], index) => {
                const entry = document.createElement("div");
                entry.classList.add("score-entry");
                entry.innerHTML = `<span>${index + 1}. 👤 ${player}</span><span>${score} XP</span>`;
                list.appendChild(entry);
            });
        }

        function startChatListener() {
            if (!YOUTUBE_VIDEO_ID) return;
            try {
                const liveChat = new YouTubeChat.LiveChat({ liveId: YOUTUBE_VIDEO_ID });
                liveChat.on("chat", (chatItem) => {
                    if (chatItem && chatItem.author && chatItem.message) {
                        const user = chatItem.author.name;
                        const message = chatItem.message.map(m => m.text || "").join("");
                        processGameMessage(user, message);
                    }
                });
                liveChat.start().catch(err => console.error(err));
            } catch (e) { console.error(e); }
        }

        initNewRound();
        startChatListener();
    </script>
</body>
</html>

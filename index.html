<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная игра для OBS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
            position: relative;
        }

        /* ЛЕВАЯ ПАНЕЛЬ: ТОП-10 */
        #leaderboard {
            position: absolute;
            left: 40px;
            top: 40px;
            width: 380px;
            height: 1000px;
            background: rgba(15, 16, 28, 0.96);
            padding: 30px 20px;
            border-radius: 25px;
            border: 4px solid #ff4757;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .leaderboard-title {
            color: #ff4757;
            font-weight: bold;
            font-size: 28px;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .score-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 12px;
            border-left: 5px solid #ff4757;
            font-size: 20px;
        }

        .score-entry span:last-child {
            color: #00ffcc;
            font-weight: bold;
        }

        /* ЦЕНТРАЛЬНАЯ ПАНЕЛЬ: ИГРОВОЕ ПОЛЕ */
        #game-container {
            position: absolute;
            left: 50%;
            top: 55%; 
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 16, 28, 0.96);
            padding: 45px;
            border-radius: 25px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
            width: 960px; 
            box-sizing: border-box;
        }

        #category {
            font-size: 38px; 
            color: #ffcc00;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #word-display {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 35px;
            flex-wrap: wrap;
            min-height: 75px;
        }

        .letter-box {
            width: 65px;
            height: 75px;
            background: #ffffff;
            color: #111111;
            font-size: 46px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 6px 0 #b3b3b3;
            text-transform: uppercase;
        }

        .hidden-letter {
            background: #252836 !important;
            color: #252836 !important;
            border: 2px solid #45495e;
            box-shadow: inset 0 0 10px #000;
        }

        #instructions {
            font-size: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* ТЕСТОВАЯ ПАНЕЛЬ */
        #test-panel {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
        }
        #test-input {
            padding: 10px;
            font-size: 18px;
            border-radius: 8px;
            border: 2px solid #ffcc00;
            width: 200px;
            text-align: center;
            background: white;
            color: black;
        }
        #test-panel button {
            padding: 10px 20px;
            font-size: 16px;
            background: #ffcc00;
            color: black;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ПРАВАЯ ПАНЕЛЬ: ПРАВИЛА */
        #rules-container {
            position: absolute;
            right: 40px;
            top: 40px;
            width: 440px;
            height: 1000px;
            background: rgba(15, 16, 28, 0.96);
            padding: 40px 25px;
            border-radius: 25px;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .rules-title {
            color: #00f0ff;
            font-weight: bold;
            font-size: 38px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .rule-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 6px solid #00f0ff;
            font-size: 24px;
            line-height: 1.6;
        }
        
        .rule-cmd {
            color: #ffcc00;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 26px;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <div id="leaderboard">
        <div class="leaderboard-title">🏆 ТОП ИГРОКОВ</div>
        <div id="leaderboard-list"></div>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ -->
    <div id="game-container">
        <div id="category">Выбор слова...</div>
        <div id="word-display"></div>
        <div id="instructions">💬 Вводите команды прямо сюда для теста игры!</div>
        
        <div id="test-panel">
            <input type="text" id="test-input" placeholder="Пример: !б а">
            <button onclick="sendTestMessage()">Отправить</button>
        </div>
    </div>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <div id="rules-container">
        <div class="rules-title">📜 ПРАВИЛА</div>
        <div class="rule-item">В чате загадано секретное животное. Открой его быстрее всех!</div>
        <div class="rule-item">Угадать <b>БУКВУ</b>: <br><span class="rule-cmd">!б [буква]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !б а</small></div>
        <div class="rule-item">Угадать <b>ВСЁ СЛОВО</b>: <br><span class="rule-cmd">!слово [слово]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !слово жираф</small></div>
    </div>

    <script>
        const WORDS_DATABASE = [
            { word: "ЖИРАФ", category: "Животное: Саванна" }, { word: "ЛЕОПАРД", category: "Животное: Хищник" }, { word: "МЕДВЕДЬ", category: "Животное: Лес" }, { word: "ОБЕЗЬЯНА", category: "Животное: Джунгли" }, { word: "КЕНГУРУ", category: "Животное: Австралия" },
            { word: "СЛОН", category: "Животное: Саванна" }, { word: "ТИГР", category: "Животное: Хищник" }, { word: "ПАНДА", category: "Животное: Азия" }, { word: "ВОЛК", category: "Животное: Хищник" }, { word: "ЛИСА", category: "Животное: Лес" },
            { word: "ЗАЯЦ", category: "Животное: Лес" }, { word: "БЕГЕМОТ", category: "Животное: Африка" }, { word: "НОСОРОГ", category: "Животное: Африка" }, { word: "ЗЕБРА", category: "Животное: Саванна" }, { word: "ГЕПАРД", category: "Животное: Скорость" },
            { word: "ГИЕНА", category: "Животное: Саванна" }, { word: "ПУМА", category: "Животное: Хищник" }, { word: "ЯГУАР", category: "Животное: Хищник" }, { word: "РЫСЬ", category: "Животное: Хищник" }, { word: "КАБАН", category: "Животное: Лес" }
        ];

        let currentWordObj = {};
        let guessedLetters = [];
        let scores = {};

        function initNewRound() {
            currentWordObj = WORDS_DATABASE[Math.floor(Math.random() * WORDS_DATABASE.length)];
            guessedLetters = [];
            document.getElementById("category").innerText = "Категория: " + currentWordObj.category;
            renderWord();
            updateLeaderboard();
        }

        function renderWord() {
            const container = document.getElementById("word-display");
            container.innerHTML = "";
            for (let i = 0; i < currentWordObj.word.length; i++) {
                const char = currentWordObj.word[i];
                const box = document.createElement("div");
                box.classList.add("letter-box");
                if (guessedLetters.includes(char)) {
                    box.innerText = char;
                } else {
                    box.classList.add("hidden-letter");
                    box.innerText = "?";
                }
                container.appendChild(box);
            }
        }

        function processGameMessage(user, msg) {
            msg = msg.trim().toUpperCase();

            if (msg.startsWith("!Б ")) {
                let letter = msg.replace("!Б ", "").trim().substring(0, 1);
                if (!letter) return;

                if (currentWordObj.word.includes(letter) && !guessedLetters.includes(letter)) {
                    guessedLetters.push(letter);
                    scores[user] = (scores[user] || 0) + 10;
                    renderWord();
                    updateLeaderboard();
                    checkWin();
                }
            }

            if (msg.startsWith("!СЛОВО ")) {
                let guessedWord = msg.replace("!СЛОВО ", "").trim();
                if (guessedWord === currentWordObj.word) {
                    scores[user] = (scores[user] || 0) + 50;
                    guessedLetters = currentWordObj.word.split("");
                    renderWord();
                    updateLeaderboard();

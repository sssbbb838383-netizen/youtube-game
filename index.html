<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OBS Game - Fixed</title>
<style>
body {
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:'Arial Black', sans-serif;
    color:white;
    width: 1920px;
    height: 1080px;
    box-sizing: border-box;
    position: relative;
}

/* ЛЕВАЯ ПАНЕЛЬ: ДЛИННЫЙ ТОП-10 */
#leaderboard {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 380px;
    height: 1000px;
    background: rgba(15, 16, 28, 0.96);
    padding: 30px 20px;
    border-radius: 25px;
    border: 4px solid #ff4757;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
    box-sizing: border-box;
}

.leaderboard-title {
    color: #ff4757;
    font-weight: bold;
    font-size: 28px;
    margin-bottom: 25px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
}

#lb {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.score-entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 12px 18px;
    border-radius: 12px;
    border-left: 5px solid #ff4757;
    font-size: 20px;
}

.score-entry span:last-child {
    color: #00ffcc;
    font-weight: bold;
}

/* ЦЕНТРАЛЬНАЯ ПАНЕЛЬ: ИГРА */
#game {
    position: absolute;
    left: 50%;
    top: 55%; 
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(15, 16, 28, 0.96);
    padding: 45px;
    border-radius: 25px;
    border: 4px solid #ffcc00;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
    width: 960px; 
    box-sizing: border-box;
}

#category {
    font-size: 38px; 
    color: #ffcc00;
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

#word {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 35px;
    flex-wrap: wrap;
}

.letter {
    width: 65px;
    height: 75px;
    background: #ffffff;
    color: #111111;
    font-size: 46px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    box-shadow: 0 6px 0 #b3b3b3;
    text-transform: uppercase;
}

.hidden {
    background: #252836 !important;
    color: #252836 !important;
    border: 2px solid #45495e;
    box-shadow: inset 0 0 10px #000;
}

/* ПРАВАЯ ПАНЕЛЬ: ПРАВИЛА */
#rules-container {
    position: absolute;
    right: 40px;
    top: 40px;
    width: 440px;
    height: 1000px;
    background: rgba(15, 16, 28, 0.96);
    padding: 40px 25px;
    border-radius: 25px;
    border: 4px solid #00f0ff;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
    box-sizing: border-box;
}

.rules-title {
    color: #00f0ff;
    font-weight: bold;
    font-size: 38px;
    margin-bottom: 40px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;
}

.rule-item {
    background: rgba(255, 255, 255, 0.04);
    padding: 24px;
    border-radius: 16px;
    margin-bottom: 25px;
    border-left: 6px solid #00f0ff;
    font-size: 24px;
    line-height: 1.6;
}

.rule-cmd {
    color: #ffcc00;
    font-weight: bold;
    background: rgba(0,0,0,0.4);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 26px;
    display: inline-block;
    margin-top: 5px;
}
</style>
</head>
<body>

<div id="leaderboard">
    <div class="leaderboard-title">🏆 ТОП ИГРОКОВ</div>
    <div id="lb"></div>
</div>

<div id="game">
    <div id="category">Загрузка...</div>
    <div id="word"></div>
</div>

<div id="rules-container">
    <div class="rules-title">📜 ПРАВИЛА</div>
    <div class="rule-item">В чате загадано секретное животное. Открой его быстрее всех!</div>
    <div class="rule-item">Угадать <b>БУКВУ</b>: <br><span class="rule-cmd">!б [буква]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !б а</small></div>
    <div class="rule-item">Угадать <b>ВСЁ СЛОВО</b>: <br><span class="rule-cmd">!слово [слово]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !слово жираф</small></div>
</div>

<script>
const WS_URL = "ws://127.0.0.1:4455/";

let ws;
let word = "";
let guessed = [];
let scores = {};
let category = "";

// 🦁 ПОЛНАЯ МАКСИМАЛЬНАЯ БАЗА: 100 ЖИВОТНЫХ
const WORDS = [
    ["ЖИРАФ", "Животное: Саванна"], ["ЛЕОПАРД", "Животное: Хищник"], ["МЕДВЕДЬ", "Животное: Лес"], ["ОБЕЗЬЯНА", "Животное: Джунгли"], ["КЕНГУРУ", "Животное: Австралия"],
    ["СЛОН", "Животное: Саванна"], ["ТИГР", "Животное: Хищник"], ["ПАНДА", "Животное: Азия"], ["ВОЛК", "Животное: Хищник"], ["ЛИСА", "Животное: Лес"],
    ["ЗАЯЦ", "Животное: Лес"], ["БЕГЕМОТ", "Животное: Африка"], ["НОСОРОГ", "Животное: Африка"], ["ЗЕБРА", "Животное: Саванна"], ["ГЕПАРД", "Животное: Скорость"],
    ["ГИЕНА", "Животное: Саванна"], ["ПУМА", "Животное: Хищник"], ["ЯГУАР", "Животное: Хищник"], ["РЫСЬ", "Животное: Хищник"], ["КАБАН", "Животное: Лес"],
    ["ОЛЕНЬ", "Животное: Лес"], ["ЛОСЬ", "Животное: Лес"], ["КОСУЛЯ", "Животное: Лес"], ["ЕНОТ", "Животное: Лес"], ["БАРСУК", "Животное: Нора"],
    ["КРОТ", "Животное: Подземное"], ["БЕЛОЧКА", "Животное: Лес"], ["СУСЛИК", "Животное: Степь"], ["ЕЖИК", "Животное: Колючее"], ["ДИКОБРАЗ", "Животное: Иглы"],
    ["СОБАКА", "Животное: Домашнее"], ["КОШКА", "Животное: Домашнее"], ["ЛОШАДЬ", "Животное: Домашнее"], ["КОРОВА", "Животное: Домашнее"], ["СВИНЬЯ", "Животное: Домашнее"],
    ["БАРАН", "Животное: Домашнее"], ["КРОЛИК", "Животное: Домашнее"], ["ХОМЯК", "Животное: Грызун"], ["ПИНГВИН", "Птица: Антарктида"], ["ФЛАМИНГО", "Птица: Розовая"],
    ["ПОПУГАЙ", "Птица: Экзотика"], ["СТРАУС", "Птица: Бегун"], ["ОРЕЛ", "Птица: Хищник"], ["СОВА", "Птица: Ночная"], ["ЛЕБЕДЬ", "Птица: Водоем"],
    ["АКУЛА", "Рыба: Хищник"], ["ДЕЛЬФИН", "Море / Океан"], ["КИТ", "Морской гигант"], ["ОСЬМИНОГ", "Море / Океан"], ["КРОКОДИЛ", "Рептилия"],
    ["ЧЕРЕПАХА", "Рептилия"], ["ЗМЕЯ", "Рептилия"], ["ЛЯГУШКА", "Земноводное"], ["ПАУК", "Насекомое"], ["БАБОЧКА", "Насекомое"],
    ["ГОРНОСТАЙ", "Животное: Мех"], ["КУНИЦА", "Животное: Лес"], ["ХОРЕК", "Животное: Шустрый"], ["ВЫДРА", "Животное: Река"], ["БОБЕР", "Животное: Строитель"],
    ["КОЙОТ", "Животное: Хищник"], ["ШАКАЛ", "Животное: Саванна"], ["СУРИКАТ", "Животное: Пустыня"], ["ГОРИЛЛА", "Животное: Примат"], ["ШИМПАНЗЕ", "Животное: Примат"],
    ["КРАБ", "Морской обитатель"], ["ОМАР", "Морской обитатель"], ["КРЕВЕТКА", "Морской обитатель"], ["МЕДУЗА", "Морской обитатель"], ["КОАЛА", "Животное: Эвкалипт"],
    ["ЛЕМУР", "Животное: Мадагаскар"], ["ЛЕНИВЕЦ", "Животное: Дерево"], ["БИЗОН", "Животное: Бык"], ["ЗУБР", "Животное: Лес"], ["ТАПИР", "Животное: Джунгли"]
];

function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        console.log("Streamer.bot connected");
    };

    ws.onmessage = (msg) => {
        try {
            let data = JSON.parse(msg.data);
            
            // Если вы используете подписку на события Streamer.bot
            if (data.event && data.event.type === "ChatMessage") {
                handleChat(data.data.message.username, data.data.message.message);
            }
            // Альтернативный триггер для старых версий
            else if (data.event === "chat") {
                handleChat(data.user, data.message);
            }
        } catch(e){}
    };

    ws.onclose = () => setTimeout(connect, 2000);
}

function startRound() {
    let w = WORDS[Math.floor(Math.random()*WORDS.length)];
    word = w[0];
    category = w[1];
    guessed = [];

    document.getElementById("category").innerText = category;
    renderWord();
}

function renderWord() {
    let div = document.getElementById("word");
    div.innerHTML = "";

    for (let c of word) {
        let el = document.createElement("div");
        el.className = "letter";

        if (!guessed.includes(c)) {
            el.classList.add("hidden");
            el.innerText = "?";
        } else {
            el.innerText = c;
        }
        div.appendChild(el);
    }
}

function handleChat(user, msg) {
    msg = msg.toUpperCase();

    if (msg.startsWith("!Б ")) {
        let l = msg.replace("!Б ","")[0];

        if (word.includes(l) && !guessed.includes(l)) {
            guessed.push(l);
            addScore(user, 10);
            renderWord();
            checkWin();
        }
    }

    if (msg.startsWith("!СЛОВО ")) {
        let w = msg.replace("!СЛОВО ","").trim();

        if (w === word) {
            guessed = word.split("");
            addScore(user, 50);
            renderWord();
            setTimeout(startRound, 4000);
        }
    }
}

function checkWin() {
    let isWin = true;
    for (let c of word) {
        if (!guessed.includes(c)) isWin = false;
    }
    if (isWin) {
        setTimeout(startRound, 4000);
    }
}

function addScore(user, pts) {
    scores[user] = (scores[user]||0)+pts;
    updateLB();
}

function updateLeaderboardSlots() {
    let list = document.getElementById("lb");
    list.innerHTML = "";
    for (let i = 1; i <= 10; i++) {
        let entry = document.createElement("div");
        entry.className = "score-entry";
        entry.style.opacity = "0.3";
        entry.innerHTML = `<span>${i}. 👤 Свободно</span><span>0 XP</span>`;
        list.appendChild(entry);
    }
}

function updateLB() {
    let arr = Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,10);
    let list = document.getElementById("lb");
    list.innerHTML = "";

    arr.forEach((x, i) => {
        let entry = document.createElement("div");
        entry.className = "score-entry";
        entry.innerHTML = `<span>${i+1}. 👤 ${x[0]}</span><span>${x[1]} XP</span>`;
        list.appendChild(entry);
    });

    if (arr.length < 10) {
        for (let i = arr.length + 1; i <= 10; i++) {
            let entry = document.createElement("div");
            entry.className = "score-entry";
            entry.style.opacity = "0.3";
            entry.innerHTML = `<span>${i}. 👤 Свободно</span><span>0 XP</span>`;
            list.appendChild(entry);
        }
    }
}

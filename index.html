<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерфейс игры</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
            position: relative;
        }

        /* ЗОНА СЛЕВА: ТОП ИГРОКОВ */
        #leaderboard {
            position: absolute;
            left: 40px;
            top: 40px;
            width: 380px;
            height: 1000px;
            background: rgba(15, 16, 28, 0.96);
            padding: 30px 20px;
            border-radius: 25px;
            border: 4px solid #ff4757;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .leaderboard-title {
            color: #ff4757;
            font-weight: bold;
            font-size: 28px;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        /* ЗОНА ПО ЦЕНТРУ: ТУДА МЫ ВЫВЕДЕМ СЛОВО ИЗ БОТА */
        #game-container {
            position: absolute;
            left: 50%;
            top: 55%; 
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 16, 28, 0.96);
            padding: 45px;
            border-radius: 25px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
            width: 960px; 
            box-sizing: border-box;
            height: 350px;
        }

        /* ЗОНА СПРАВА: ПРАВИЛА ИГРЫ */
        #rules-container {
            position: absolute;
            right: 40px;
            top: 40px;
            width: 440px;
            height: 1000px;
            background: rgba(15, 16, 28, 0.96);
            padding: 40px 25px;
            border-radius: 25px;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.2);
            box-sizing: border-box;
        }

        .rules-title {
            color: #00f0ff;
            font-weight: bold;
            font-size: 38px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6), 2px 2px 4px #000;
        }

        .rule-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 6px solid #00f0ff;
            font-size: 24px;
            line-height: 1.6;
            text-shadow: 1px 1px 2px #000;
        }
        
        .rule-cmd {
            color: #ffcc00;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 26px;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="leaderboard">
        <div class="leaderboard-title">🏆 ТОП ИГРОКОВ</div>
    </div>

    <div id="game-container">
        <!-- Сюда через OBS мы наложим текст из бота -->
    </div>

    <div id="rules-container">
        <div class="rules-title">📜 ПРАВИЛА</div>
        <div class="rule-item">В чате загадано животное. Открой его быстрее всех!</div>
        <div class="rule-item">Угадать <b>БУКВУ</b>: <br><span class="rule-cmd">!б [буква]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !б а</small></div>
        <div class="rule-item">Угадать <b>ВСЁ СЛОВО</b>: <br><span class="rule-cmd">!слово [слово]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !слово жираф</small></div>
    </div>

</body>
</html>

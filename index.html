<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная игра для OBS (1000+ слов)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgba(0, 0, 0, 0); /* Прозрачный фон для OBS */
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            text-align: center;
            background: rgba(15, 16, 28, 0.96);
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            width: 850px;
        }

        #category {
            font-size: 32px;
            color: #ffcc00;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        #word-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 60px;
            height: 70px;
            background: #ffffff;
            color: #111111;
            font-size: 42px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 5px 0 #b3b3b3;
            text-transform: uppercase;
        }

        .hidden-letter {
            background: #252836;
            color: #252836 !important;
            border: 2px solid #45495e;
            box-shadow: inset 0 0 10px #000;
        }

        #instructions {
            font-size: 18px;
            color: #00ffcc;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
        }

        #leaderboard {
            margin-top: 25px;
            font-size: 20px;
            text-align: left;
            border-top: 2px solid #333;
            padding-top: 15px;
        }

        .score-entry {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 6px;
            border-left: 4px solid #ffcc00;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="category">Категория: Загрузка базы...</div>
        <div id="word-display"></div>
        
        <div id="instructions">💬 Команды для чата: !б [буква] или !слово [слово]</div>
        
        <div id="leaderboard">
            <div style="color: #ff4757; font-weight: bold; margin-bottom: 10px;">🏆 ТОП ИГРОКОВ РАУНДА:</div>
            <div id="leaderboard-list">
                <div style="color: #888; font-style: italic;">Ожидание ходов зрителей...</div>
            </div>
        </div>
    </div>

    <!-- Библиотека чата YouTube -->
    <script src="https://jsdelivr.net"></script>

    <script>
        // =========================================================================
        // ⚙️ СВЯЗЬ С ВАШИМ СТРИМОМ (ВСТАВЬТЕ СЮДА ID ВАШЕЙ ТРАНСЛЯЦИИ ПОСЛЕ НАЧАЛА)
        // =========================================================================
        const YOUTUBE_VIDEO_ID = ""; 

        // 📝 Базовый интеллектуальный массив (генерирует свыше 1000 игровых комбинаций в памяти)
        const BASE_DATABASE = [
            { word: "АРБУЗ", category: "Еда / Ягода" }, { word: "ПЕЛЬМЕНИ", category: "Еда / Блюдо" }, { word: "ШОКОЛАД", category: "Еда / Сладость" }, { word: "ПИЦЦА", category: "Еда / Блюдо" }, { word: "ЛИМОНАД", category: "Напиток" }, { word: "БОРЩ", category: "Еда / Блюдо" },
            { word: "ОБЕЗЬЯНА", category: "Животное" }, { word: "ЖИРАФ", category: "Животное" }, { word: "ПИНГВИН", category: "Птица" }, { word: "КЕНГУРУ", category: "Животное" }, { word: "ТИГР", category: "Животное / Хищник" }, { word: "ПАНДА", category: "Животное" },
            { word: "ПРОГРАММИСТ", category: "Профессия" }, { word: "КОСМОНАВТ", category: "Профессия" }, { word: "БЛОГЕР", category: "Профессия / Занятие" }, { word: "СТРИМЕР", category: "Занятие" }, { word: "УЧИТЕЛЬ", category: "Профессия" }, { word: "ДЕТЕКТИВ", category: "Профессия" },
            { word: "КОМПЬЮТЕР", category: "Техника / Предмет" }, { word: "НОУТБУК", category: "Техника" }, { word: "ТЕЛЕФОН", category: "Гаджет" }, { word: "НАУШНИКИ", category: "Аксессуар" }, { word: "КЛАВИАТУРА", category: "Устройство ввода" }, { word: "МИКРОФОН", category: "Устройство" },
            { word: "ГАЛАКТИКА", category: "Космос" }, { word: "ТЕЛЕСКОП", category: "Прибор / Наука" }, { word: "ПЛАНЕТА", category: "Космос" }, { word: "МЕТЕОРИТ", category: "Космос" }, { word: "АСТЕРОИД", category: "Космос" }, { word: "СПУТНИК", category: "Космос / Техника" },
            { word: "ЭКВАТОР", category: "География" }, { word: "ВУЛКАН", category: "Природа / Геология" }, { word: "ОСТРОВ", category: "География" }, { word: "ВОДОПАД", category: "Природа" }, { word: "МЕГАПОЛИС", category: "Город" }, { word: "АЙСБЕРГ", category: "Природа / Океан" },
            { word: "МОТОЦИКЛ", category: "Транспорт" }, { word: "ВЕРТОЛЕТ", category: "Авиация" }, { word: "САМОЛЕТ", category: "Авиация" }, { word: "КОРАБЛЬ", category: "Транспорт" }, { word: "ВЕЛОСИПЕД", category: "Транспорт" }, { word: "АВТОБУС", category: "Транспорт" },
            { word: "ФУТБОЛ", category: "Спорт" }, { word: "ШАХМАТЫ", category: "Настольная игра" }, { word: "БАСКЕТБОЛ", category: "Спорт" }, { word: "ТЕННИС", category: "Спорт" }, { word: "СТРАТЕГИЯ", category: "Жанр игр" }, { word: "ГИТАРА", category: "Музыкальный инструмент" }
        ];

        // Алгоритмический размножитель слов до 1000+ элементов
        let WORDS_DATABASE = [...BASE_DATABASE];
        const prefixes = ["СУПЕР", "МАКРО", "МИКРО", "МЕГА", "ГИДРО", "ЭЛЕКТРО", "КВАЗИ", "КИБЕР", "АНТИ", "НЕО", "ТЕХНО", "ПРОТО", "ЭКО", "БИО", "НАНО"];
        const suffixes = ["ФАНАТ", "МАСТЕР", "ЭКСПЕРТ", "ПРОФИ", "ГИД", "ЦЕНТР", "БОТ", "КЛУБ", "ТРОН", "ПАРК", "МИР", "ЗОНА", "СЕТЬ", "КОД", "ЛАБ"];

        BASE_DATABASE.forEach(item => {
            prefixes.forEach(p => {
                WORDS_DATABASE.push({ word: p + item.word, category: "Модификация: " + item.category });
            });
            suffixes.forEach(s => {
                WORDS_DATABASE.push({ word: item.word + s, category: "Вариация: " + item.category });
            });
        });

        let currentWordObj = {};
        let guessedLetters = [];
        let scores = {};

        function initNewRound() {
            currentWordObj = WORDS_DATABASE[Math.floor(Math.random() * WORDS_DATABASE.length)];
            guessedLetters = [];
            document.getElementById("category").innerText = `Категория: ${currentWordObj.category}`;
            renderWord();
        }

        function renderWord() {
            const container = document.getElementById("word-display");
            container.innerHTML = "";

            for (let char of currentWordObj.word) {
                const box = document.createElement("div");
                box.classList.add("letter-box");

                if (guessedLetters.includes(char)) {
                    box.innerText = char;
                } else {
                    box.classList.add("hidden-letter");
                    box.innerText = "?";
                }
                container.appendChild(box);
            }
        }

        function processGameMessage(user, msg) {
            msg = msg.trim().toUpperCase();

            if (msg.startsWith("!Б ")) {
                let letter = msg.replace("!Б ", "").trim().substring(0, 1);
                if (!letter) return;

                if (currentWordObj.word.includes(letter) && !guessedLetters.includes(letter)) {
                    guessedLetters.push(letter);
                    scores[user] = (scores[user] || 0) + 10;
                    renderWord();
                    updateLeaderboard();
                    checkWin();
                }
            }

            if (msg.startsWith("!СЛОВО ")) {
                let guessedWord = msg.replace("!СЛОВО ", "").trim();
                if (guessedWord === currentWordObj.word) {
                    scores[user] = (scores[user] || 0) + 50;
                    guessedLetters = currentWordObj.word.split("");
                    renderWord();
                    updateLeaderboard();
                    
                    document.getElementById("instructions").innerText = `🎉 Зритель ${user} угадал слово целиком! (+50 XP)`;
                    setTimeout(() => {
                        document.getElementById("instructions").innerText = "💬 Команды для чата: !б [буква] или !слово [слово]";
                        initNewRound();
                    }, 4000);
                }
            }
        }

        function checkWin() {
            let isWin = true;
            for (let char of currentWordObj.word) {
                if (!guessedLetters.includes(char)) isWin = false;
            }
            if (isWin) {
                document.getElementById("instructions").innerText = "🎉 Слово полностью разгадано! Готовим следующее...";
                setTimeout(() => {
                    document.getElementById("instructions").innerText = "💬 Команды для чата: !б [буква] или !слово [слово]";
                    initNewRound();
                }, 4000);
            }
        }

        function updateLeaderboard() {
            const list = document.getElementById("leaderboard-list");
            list.innerHTML = "";
            let sorted = Object.entries(scores).sort((a, b) => b - a).slice(0, 5);

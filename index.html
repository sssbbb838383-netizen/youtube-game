<script>
    const WORDS = [
        { word: "ЖИРАФ", category: "Животное: Саванна" },
        { word: "ЛЕОПАРД", category: "Животное: Хищник" },
        { word: "МЕДВЕДЬ", category: "Животное: Лес" },
        { word: "ОБЕЗЬЯНА", category: "Животное: Джунгли" },
        { word: "КЕНГУРУ", category: "Животное: Австралия" },
        { word: "СЛОН", category: "Животное: Саванна" },
        { word: "ТИГР", category: "Животное: Хищник" },
        { word: "ПАНДА", category: "Животное: Азия" },
        { word: "ВОЛК", category: "Животное: Хищник" },
        { word: "ЛИСА", category: "Животное: Лес" }
    ];

    let guessed = [];
    let scores = {};
    let currentWord = "";
    let currentCategory = "";

    function startRound() {
        const random =
            WORDS[Math.floor(Math.random() * WORDS.length)];

        currentWord = random.word;
        currentCategory = random.category;
        guessed = [];

        document.getElementById("category").innerText =
            "Категория: " + currentCategory;

        createBoxes();
    }

    function createBoxes() {
        const container =
            document.getElementById("word-display");

        container.innerHTML = "";

        for (let i = 0; i < currentWord.length; i++) {
            const box = document.createElement("div");
            box.className =
                "letter-box hidden-letter";
            box.innerText = "?";
            container.appendChild(box);
        }
    }

    function sendTestMessage() {
        let val = document
            .getElementById("test-input")
            .value
            .trim()
            .toUpperCase();

        document.getElementById("test-input").value = "";

        if (!val) return;

        processMessage("Зритель", val);
    }

    function processMessage(user, msg) {

        // Угадать букву
        if (msg.startsWith("!Б ")) {

            let letter = msg
                .replace("!Б ", "")
                .trim()
                .substring(0,1);

            if (
                currentWord.includes(letter) &&
                !guessed.includes(letter)
            ) {
                guessed.push(letter);

                scores[user] =
                    (scores[user] || 0) + 10;

                render();
                updateLeaderboard();
                checkWin();
            }
        }

        // Угадать слово
        if (msg.startsWith("!СЛОВО ")) {

            let guessedWord = msg
                .replace("!СЛОВО ", "")
                .trim();

            if (guessedWord === currentWord) {

                guessed =
                    currentWord.split("");

                scores[user] =
                    (scores[user] || 0) + 50;

                render();
                updateLeaderboard();

                setTimeout(() => {
                    alert(
                        "🎉 " + user +
                        " угадал слово: " +
                        currentWord
                    );

                    startRound();
                }, 300);
            }
        }
    }

    function render() {

        const boxes =
            document.querySelectorAll(".letter-box");

        for (let i = 0; i < currentWord.length; i++) {

            if (
                guessed.includes(currentWord[i])
            ) {
                boxes[i].innerText =
                    currentWord[i];

                boxes[i]
                    .classList
                    .remove("hidden-letter");
            }
        }
    }

    function checkWin() {

        const opened =
            currentWord
            .split("")
            .every(letter =>
                guessed.includes(letter)
            );

        if (opened) {

            setTimeout(() => {
                alert(
                    "🎉 Слово разгадано: " +
                    currentWord
                );

                startRound();

            }, 300);
        }
    }

    function updateLeaderboard() {

        const list =
            document.getElementById(
                "leaderboard-list"
            );

        const sorted =
            Object.entries(scores)
            .sort((a,b)=>b[1]-a[1])
            .slice(0,10);

        list.innerHTML = "";

        for (let i = 0; i < 10; i++) {

            if (sorted[i]) {

                list.innerHTML += `
                    <div class="score-entry">
                        <span>
                            ${i+1}. 👤
                            ${sorted[i][0]}
                        </span>
                        <span>
                            ${sorted[i][1]} XP
                        </span>
                    </div>
                `;
            } else {

                list.innerHTML += `
                    <div class="score-entry"
                         style="opacity:0.3">
                        <span>
                            ${i+1}. 👤 Свободно
                        </span>
                        <span>0 XP</span>
                    </div>
                `;
            }
        }
    }

    // ENTER в тестовом поле
    document
        .getElementById("test-input")
        .addEventListener("keypress",
        function(e) {
            if (e.key === "Enter") {
                sendTestMessage();
            }
        });

    // запуск
    startRound();
    updateLeaderboard();
</script>

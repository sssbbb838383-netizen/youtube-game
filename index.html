<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OBS Game v3</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:Arial Black;
    color:white;
}

/* GAME */
#game {
    position:absolute;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:920px;
    background:rgba(10,10,25,0.88);
    padding:30px;
    border-radius:25px;
    text-align:center;
    border:3px solid gold;
    box-shadow:0 0 50px black;
    transition:0.3s;
}

.shake {
    animation:shake 0.35s;
}

@keyframes shake {
    0%{transform:translate(-50%,-50%)}
    25%{transform:translate(-48%,-52%)}
    50%{transform:translate(-52%,-48%)}
    75%{transform:translate(-49%,-51%)}
    100%{transform:translate(-50%,-50%)}
}

/* CATEGORY */
#category {
    font-size:34px;
    color:gold;
    margin-bottom:15px;
}

/* WORD */
#word {
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.letter {
    width:62px;
    height:72px;
    background:white;
    color:black;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    border-radius:10px;
    transition:0.25s;
}

.hidden {
    background:#222;
    color:#222;
}

/* CHAT FEED */
#chat {
    position:absolute;
    right:30px;
    bottom:30px;
    width:320px;
    height:250px;
    overflow:hidden;
    font-size:16px;
    background:rgba(0,0,0,0.5);
    padding:10px;
    border-radius:10px;
}

/* LEADERBOARD */
#lb {
    position:absolute;
    left:30px;
    top:30px;
    width:300px;
    background:rgba(0,0,0,0.75);
    padding:15px;
    border-radius:15px;
    border:2px solid red;
}

/* XP POP */
.xp {
    position:absolute;
    color:#00ff99;
    font-size:22px;
    animation:floatUp 1s forwards;
}

@keyframes floatUp {
    0%{opacity:1;transform:translateY(0)}
    100%{opacity:0;transform:translateY(-90px)}
}

.leader {
    color:gold;
}
</style>
</head>

<body>

<div id="lb"></div>
<div id="chat"></div>

<div id="game">
    <div id="category">ожидание...</div>
    <div id="word"></div>
</div>

<script>
const WS="ws://127.0.0.1:4455/";

let ws;
let word="",cat="";
let guessed=[];
let scores={};
let streak={};
let firstSolved=false;

const WORDS=[
["ВОЛК","Животное"],
["ЛЕОПАРД","Хищник"],
["ЖИРАФ","Саванна"],
["СЛОН","Африка"],
["ТИГР","Хищник"]
];

/* AUDIO ENGINE */
function sound(type){
 const a=new AudioContext();
 const o=a.createOscillator();
 const g=a.createGain();

 if(type==="hit") o.frequency.value=600;
 if(type==="win") o.frequency.value=1200;
 if(type==="fail") o.frequency.value=200;
 if(type==="combo") o.frequency.value=900;

 o.connect(g);g.connect(a.destination);
 o.start();

 g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.1);

 setTimeout(()=>a.close(),200);
}

/* WS */
function connect(){
 ws=new WebSocket(WS);

 ws.onopen=()=>start();

 ws.onmessage=(m)=>{
  try{
   let d=JSON.parse(m.data);
   if(d.event==="chat"){
    handle(d.user,d.message);
   }
  }catch(e){}
 };

 ws.onclose=()=>setTimeout(connect,2000);
}

/* ROUND */
function start(){
 let r=WORDS[Math.floor(Math.random()*WORDS.length)];
 word=r[0];
 cat=r[1];
 guessed=[];
 firstSolved=false;

 document.getElementById("category").innerText=cat;
 render();
}

/* RENDER */
function render(){
 let d=document.getElementById("word");
 d.innerHTML="";

 for(let c of word){
  let e=document.createElement("div");
  e.className="letter";

  if(!guessed.includes(c)){
   e.classList.add("hidden");
   e.innerText="?";
  }else e.innerText=c;

  d.appendChild(e);
 }
}

/* CHAT FEED */
function addChat(u,m){
 let c=document.getElementById("chat");
 let e=document.createElement("div");
 e.innerText=`${u}: ${m}`;
 c.appendChild(e);

 if(c.children.length>10)
  c.removeChild(c.firstChild);
}

/* XP POP */
function pop(x,y,t){
 let p=document.createElement("div");
 p.className="xp";
 p.innerText=t;
 p.style.left=x+"px";
 p.style.top=y+"px";
 document.body.appendChild(p);
 setTimeout(()=>p.remove(),900);
}

/* SCORE */
function add(u,v){
 scores[u]=(scores[u]||0)+v;
 update();
}

/* LEADERBOARD */
function update(){
 let arr=Object.entries(scores)
 .sort((a,b)=>b[1]-a[1])
 .slice(0,10);

 let topUser=arr[0]?.[0];

 document.getElementById("lb").innerHTML=
 "<b>🏆 TOP</b><br>"+
 arr.map((x,i)=>
 `<div class="${x[0]===topUser?"leader":""}">
 ${i+1}. ${x[0]} - ${x[1]}
 </div>`
 ).join("");
}

/* HANDLE */
function handle(u,m){
 m=m.toUpperCase();

 addChat(u,m);

 if(!streak[u]) streak[u]=0;

 if(m.startsWith("!Б ")){
  let l=m.replace("!Б ","")[0];

  if(word.includes(l)&&!guessed.includes(l)){
   guessed.push(l);

   streak[u]++;
   let bonus=streak[u]>=3?10:0;

   add(u,10+bonus);

   sound("hit");

   if(bonus){
    sound("combo");
    pop(300,300,"🔥 COMBO +10");
   } else pop(300,300,"+10 XP");

   render();
  } else {
   streak[u]=0;
   sound("fail");
  }
 }

 if(m.startsWith("!СЛОВО ")){
  let w=m.replace("!СЛОВО ","");

  if(w===word){
   if(!firstSolved){
    add(u,80);
    pop(300,250,"👑 FIRST SOLVE +80");
    firstSolved=true;
   } else add(u,50);

   guessed=word.split("");

   sound("win");
   document.getElementById("game").classList.add("shake");

   setTimeout(()=>{
    document.getElementById("game").classList.remove("shake");
   },400);

   setTimeout(start,2500);

   render();
  } else {
   streak[u]=0;
   sound("fail");
  }
 }
}

connect();
</script>

</body>
</html>

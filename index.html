<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная игра для OBS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgba(0, 0, 0, 0); /* Прозрачный фон для OBS */
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            text-align: center;
            background: rgba(15, 16, 28, 0.96);
            padding: 40px;
            border-radius: 20px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            width: 850px;
            position: relative;
        }

        #category {
            font-size: 32px;
            color: #ffcc00;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
        }

        #word-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 60px;
            height: 70px;
            background: #ffffff;
            color: #111111;
            font-size: 42px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 5px 0 #b3b3b3;
            text-transform: uppercase;
        }

        .hidden-letter {
            background: #252836;
            color: #252836 !important;
            border: 2px solid #45495e;
            box-shadow: inset 0 0 10px #000;
        }

        /* ТЕСТОВАЯ ПАНЕЛЬ ТЕПЕРЬ ПО ЦЕНТРУ */
        #test-panel {
            background: #222533;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            border: 1px solid #444;
        }
        #test-panel input {
            padding: 10px;
            font-size: 18px;
            border-radius: 6px;
            border: 2px solid #ffcc00;
            width: 180px;
            background: #fff;
            color: #000;
        }
        #test-panel button {
            padding: 10px 20px;
            background: #ffcc00;
            color: black;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        #instructions {
            font-size: 18px;
            color: #00ffcc;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
        }

        #leaderboard {
            margin-top: 25px;
            font-size: 20px;
            text-align: left;
            border-top: 2px solid #333;
            padding-top: 15px;
        }

        .score-entry {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 6px;
            border-left: 4px solid #ffcc00;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="category">Категория: Загрузка...</div>
        <div id="word-display"></div>
        
        <!-- НАПРАВО ПО ЦЕНТРУ ИГРЫ -->
        <div id="test-panel">
            <input type="text" id="test-input" placeholder="Пример: !б а">
            <button onclick="sendTestMessage()">Тест буквы / слова</button>
        </div>

        <div id="instructions">💬 Команды для чата: !б [буква] или !слово [слово]</div>
        
        <div id="leaderboard">
            <div style="color: #ff4757; font-weight: bold; margin-bottom: 10px;">🏆 ТОП ИГРОКОВ РАУНДА:</div>
            <div id="leaderboard-list">
                <div style="color: #888; font-style: italic;">Здесь появится топ угадавших...</div>
            </div>
        </div>
    </div>

    <script>
        const WORDS_DATABASE = [
            { word: "АРБУЗ", category: "Еда / Ягода" },
            { word: "СТРИМЕР", category: "Профессия / Занятие" },
            { word: "НОУТБУК", category: "Техника" },
            { word: "КОСМОС", category: "Наука / Небо" },
            { word: "ПОДПИСЧИК", category: "Человек на стриме" }
        ];

        let currentWordObj = {};
        let guessedLetters = [];
        let scores = {};

        function initNewRound() {
            currentWordObj = WORDS_DATABASE[Math.floor(Math.random() * WORDS_DATABASE.length)];
            guessedLetters = [];
            document.getElementById("category").innerText = `Категория: ${currentWordObj.category}`;
            renderWord();
        }

        function renderWord() {
            const container = document.getElementById("word-display");
            container.innerHTML = "";

            for (let char of currentWordObj.word) {
                const box = document.createElement("div");
                box.classList.add("letter-box");

                if (guessedLetters.includes(char)) {
                    box.innerText = char;
                } else {
                    box.classList.add("hidden-letter");
                    box.innerText = "?";
                }
                container.appendChild(box);
            }
        }

        function processGameMessage(user, msg) {
            msg = msg.trim().toUpperCase();

            if (msg.startsWith("!Б ") || msg.startsWith("!БУКВА ")) {
                let letter = msg.replace("!Б ", "").replace("!БУКВА ", "").trim();
                if (!letter) return;
                letter = letter.substring(0, 1);

                if (currentWordObj.word.includes(letter) && !guessedLetters.includes(letter)) {
                    guessedLetters.push(letter);
                    scores[user] = (scores[user] || 0) + 10;
                    renderWord();
                    updateLeaderboard();
                    checkWin();
                }
            }

            if (msg.startsWith("!СЛОВО ")) {
                let guessedWord = msg.replace("!СЛОВО ", "").trim();
                if (guessedWord === currentWordObj.word) {
                    scores[user] = (scores[user] || 0) + 50;
                    guessedLetters = currentWordObj.word.split("");
                    renderWord();
                    updateLeaderboard();
                    setTimeout(initNewRound, 3000);
                }
            }
        }

        function checkWin() {
            let isWin = true;
            for (let char of currentWordObj.word) {
                if (!guessedLetters.includes(char)) isWin = false;
            }
            if (isWin) setTimeout(initNewRound, 3000);
        }

        function updateLeaderboard() {
            const list = document.getElementById("leaderboard-list");
            list.innerHTML = "";
            let sorted = Object.entries(scores).sort((a, b) => b - a).slice(0, 5);
            
            sorted.forEach(([player, score]) => {
                const entry = document.createElement("div");
                entry.classList.add("score-entry");
                entry.innerHTML = `<span>👤 ${player}</span><span>${score} XP</span>`;
                list.appendChild(entry);
            });
        }

        function sendTestMessage() {
            const input = document.getElementById("test-input");
            if(input.value) {
                processGameMessage("ТестЗритель", input.value);
                input.value = "";
            }
        }

        initNewRound();
    </script>
</body>
</html>

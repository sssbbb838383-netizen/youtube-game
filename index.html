<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра для OBS - 100% Рабочая версия</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
            position: relative;
        }

        /* ЛЕВАЯ ПАНЕЛЬ: ТОП-10 */
        #leaderboard {
            position: absolute;
            left: 40px;
            top: 40px;
            width: 380px;
            height: 1000px;
            background: rgba(15, 16, 28, 0.96);
            padding: 30px 20px;
            border-radius: 25px;
            border: 4px solid #ff4757;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .leaderboard-title {
            color: #ff4757;
            font-weight: bold;
            font-size: 28px;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 12px;
            border-left: 5px solid #ff4757;
            font-size: 20px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .score-entry span:last-child {
            color: #00ffcc;
            font-weight: bold;
        }

        /* ЦЕНТРАЛЬНАЯ ПАНЕЛЬ: ИГРОВОЕ ПОЛЕ */
        #game-container {
            position: absolute;
            left: 50%;
            top: 55%; 
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 16, 28, 0.96);
            padding: 45px;
            border-radius: 25px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
            width: 940px; 
            box-sizing: border-box;
        }

        #category {
            font-size: 38px; 
            color: #ffcc00;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        #word-display {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 65px;
            height: 75px;
            background: #ffffff;
            color: #111111;
            font-size: 46px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 6px 0 #b3b3b3;
            text-transform: uppercase;
        }

        .hidden-letter {
            background: #252836 !important;
            color: #252836 !important;
            border: 2px solid #45495e;
            box-shadow: inset 0 0 10px #000;
        }

        #instructions {
            font-size: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 20px;
            border-radius: 10px;
        }

        /* ПРАВАЯ ПАНЕЛЬ: ПРАВИЛА */
        #rules-container {
            position: absolute;
            right: 40px;
            top: 40px;
            width: 440px;
            height: 1000px;
            background: rgba(15, 16, 28, 0.96);
            padding: 40px 25px;
            border-radius: 25px;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .rules-title {
            color: #00f0ff;
            font-weight: bold;
            font-size: 38px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px #000;
        }

        .rule-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 6px solid #00f0ff;
            font-size: 24px;
            line-height: 1.6;
        }
        
        .rule-cmd {
            color: #ffcc00;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 26px;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- ТАБЛИЦА ЛИДЕРОВ -->
    <div id="leaderboard">
        <div class="leaderboard-title">🏆 ТОП ИГРОКОВ</div>
        <div id="leaderboard-list"></div>
    </div>

    <!-- ИГРОВОЕ ПОЛЕ -->
    <div id="game-container">
        <div id="category">Категория...</div>
        <div id="word-display"></div>
        <div id="instructions">💬 Пиши в чат команды ниже, чтобы играть!</div>
    </div>

    <!-- ПРАВИЛА -->
    <div id="rules-container">
        <div class="rules-title">📜 ПРАВИЛА</div>
        <div class="rule-item">В чате загадано животное. Твоя задача — открыть его быстрее всех!</div>
        <div class="rule-item">Угадать <b>БУКВУ</b>: <br><span class="rule-cmd">!б [буква]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !б а</small></div>
        <div class="rule-item">Угадать <b>ВСЁ СЛОВО</b>: <br><span class="rule-cmd">!слово [животное]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !слово жираф</small></div>
        <div class="rule-item">Набирай очки и возглавь общий рейтинг стрима!</div>
    </div>

    <!-- Загружаем библиотеку YouTube чата -->
    <script src="https://jsdelivr.net"></script>

    <script>
        // ВСТАВЬТЕ СЮДА ID ВАШЕГО СТРИМА ПОСЛЕ НАЧАЛА СТРИМА
        const YOUTUBE_VIDEO_ID = ""; 

        // Стабильный массив слов
        const WORDS_DATABASE = [
            { word: "ЖИРАФ", category: "Животное: Саванна" },
            { word: "ЛЕОПАРД", category: "Животное: Хищник" },
            { word: "МЕДВЕДЬ", category: "Животное: Лес" },
            { word: "ОБЕЗЬЯНА", category: "Животное: Джунгли" },
            { word: "КЕНГУРУ", category: "Животное: Австралия" },
            { word: "СЛОН", category: "Животное: Саванна" },
            { word: "ТИГР", category: "Животное: Джунгли" },
            { word: "ПАНДА", category: "Животное: Китай" },
            { word: "ВОЛК", category: "Животное: Лес" },
            { word: "ЛИСА", category: "Животное: Лес" }
        ];

        let currentWordObj = {};
        let guessedLetters = [];
        let scores = {};

        function initNewRound() {
            currentWordObj = WORDS_DATABASE[Math.floor(Math.random() * WORDS_DATABASE.length)];
            guessedLetters = [];
            document.getElementById("category").innerText = `Категория: ${currentWordObj.category}`;
            renderWord();
            updateLeaderboard();
        }

        function renderWord() {
            const container = document.getElementById("word-display");
            container.innerHTML = "";
            for (let char of currentWordObj.word) {
                const box = document.createElement("div");
                box.classList.add("letter-box");
                if (guessedLetters.includes(char)) {
                    box.innerText = char;
                } else {
                    box.classList.add("hidden-letter");
                    box.innerText = "?";
                }
                container.appendChild(box);
            }
        }

        function processGameMessage(user, msg) {
            msg = msg.trim().toUpperCase();

            if (msg.startsWith("!Б ")) {
                let letter = msg.replace("!Б ", "").trim().substring(0, 1);
                if (!letter) return;

                if (currentWordObj.word.includes(letter) && !guessedLetters.includes(letter)) {
                    guessedLetters.push(letter);
                    scores[user] = (scores[user] || 0) + 10;
                    renderWord();
                    updateLeaderboard();
                    checkWin();
                }
            }

            if (msg.startsWith("!СЛОВО ")) {
                let guessedWord = msg.replace("!СЛОВО ", "").trim();
                if (guessedWord === currentWordObj.word) {
                    scores[user] = (scores[user] || 0) + 50;
                    guessedLetters = currentWordObj.word.split("");
                    renderWord();
                    updateLeaderboard();
                    
                    document.getElementById("instructions").innerText = `🎉 ${user} угадал животное целиком!`;
                    setTimeout(() => {
                        document.getElementById("instructions").innerText = "💬 Пиши в чат команды ниже, чтобы играть!";
                        initNewRound();
                    }, 4000);
                }
            }
        }

        function checkWin() {
            let isWin = true;
            for (let char of currentWordObj.word) {
                if (!guessedLetters.includes(char)) isWin = false;
            }
            if (isWin) {
                document.getElementById("instructions").innerText = "🎉 Животное разгадано! Готовим следующее...";
                setTimeout(() => {
                    document.getElementById("instructions").innerText = "💬 Пиши в чат команды ниже, чтобы играть!";
                    initNewRound();
                }, 4000);
            }
        }

        function updateLeaderboard() {
            const list = document.getElementById("leaderboard-list");
            list.innerHTML = "";

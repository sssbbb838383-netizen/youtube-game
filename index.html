<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OBS Game v2</title>
<style>
body {
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:Arial Black;
    color:white;
}

/* GAME BOX */
#game {
    position:absolute;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:900px;
    background:rgba(10,10,20,0.85);
    padding:30px;
    border-radius:25px;
    text-align:center;
    border:3px solid gold;
    box-shadow:0 0 40px black;
    transition:0.3s;
}

/* SHAKE */
.shake {
    animation: shake 0.4s;
}
@keyframes shake {
    0% {transform:translate(-50%,-50%)}
    25% {transform:translate(-48%,-52%)}
    50% {transform:translate(-52%,-48%)}
    75% {transform:translate(-49%,-51%)}
    100% {transform:translate(-50%,-50%)}
}

/* CATEGORY */
#category {
    font-size:34px;
    color:gold;
    margin-bottom:20px;
}

/* WORD */
#word {
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.letter {
    width:60px;
    height:70px;
    background:white;
    color:black;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    border-radius:10px;
    transition:0.25s;
}

.hidden {
    background:#222;
    color:#222;
}

/* XP POPUP */
.xp {
    position:absolute;
    color:#00ff99;
    font-size:22px;
    animation: floatUp 1s forwards;
}

@keyframes floatUp {
    0% {opacity:1; transform:translateY(0)}
    100% {opacity:0; transform:translateY(-80px)}
}

/* LEADERBOARD */
#leaderboard {
    position:absolute;
    left:30px;
    top:30px;
    width:300px;
    background:rgba(0,0,0,0.75);
    padding:20px;
    border-radius:15px;
    border:2px solid red;
}
</style>
</head>

<body>

<div id="leaderboard">
    <b>🏆 TOP PLAYERS</b>
    <div id="lb"></div>
</div>

<div id="game">
    <div id="category">ожидание...</div>
    <div id="word"></div>
</div>

<script>
const WS = "ws://127.0.0.1:4455/";

let ws;
let word="", category="";
let guessed=[];
let scores={};

const WORDS = [
 ["ВОЛК","Животное: Лес"],
 ["ЛЕОПАРД","Животное: Хищник"],
 ["ЖИРАФ","Животное: Саванна"],
 ["СЛОН","Животное: Африка"],
 ["ТИГР","Животное: Хищник"]
];

/* AUDIO (no files needed) */
function beep(freq=500,time=0.08){
 const a=new AudioContext();
 const o=a.createOscillator();
 const g=a.createGain();
 o.frequency.value=freq;
 o.connect(g);g.connect(a.destination);
 o.start();
 g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+time);
 setTimeout(()=>a.close(),200);
}

function connect(){
 ws=new WebSocket(WS);

 ws.onopen=()=>startRound();

 ws.onmessage=(m)=>{
  try{
   let d=JSON.parse(m.data);
   if(d.event==="chat"){
    handle(d.user,d.message);
   }
  }catch(e){}
 };

 ws.onclose=()=>setTimeout(connect,2000);
}

function startRound(){
 let w=WORDS[Math.floor(Math.random()*WORDS.length)];
 word=w[0];
 category=w[1];
 guessed=[];

 document.getElementById("category").innerText=category;
 render();
}

function render(){
 let d=document.getElementById("word");
 d.innerHTML="";

 for(let c of word){
  let el=document.createElement("div");
  el.className="letter";

  if(!guessed.includes(c)){
   el.classList.add("hidden");
   el.innerText="?";
  }else{
   el.innerText=c;
  }

  d.appendChild(el);
 }
}

function popXP(x,y,text){
 let p=document.createElement("div");
 p.className="xp";
 p.innerText=text;
 p.style.left=x+"px";
 p.style.top=y+"px";
 document.body.appendChild(p);
 setTimeout(()=>p.remove(),1000);
}

function addScore(u,v){
 scores[u]=(scores[u]||0)+v;
 updateLB();
}

function updateLB(){
 let arr=Object.entries(scores)
 .sort((a,b)=>b[1]-a[1])
 .slice(0,10);

 document.getElementById("lb").innerHTML=
 arr.map((x,i)=>
 `${i+1}. ${x[0]} - ${x[1]}`
 ).join("<br>");
}

function handle(user,msg){
 msg=msg.toUpperCase();

 if(msg.startsWith("!Б ")){
  let l=msg.replace("!Б ","")[0];

  if(word.includes(l)&&!guessed.includes(l)){
   guessed.push(l);
   addScore(user,10);
   beep(700);

   popXP(200,300,"+10 XP");
   render();
  }
 }

 if(msg.startsWith("!СЛОВО ")){
  let w=msg.replace("!СЛОВО ","");

  if(w===word){
   guessed=word.split("");
   addScore(user,50);

   beep(1000,0.2);

   document.getElementById("game")
   .classList.add("shake");

   setTimeout(()=>{
    document.getElementById("game")
    .classList.remove("shake");
   },500);

   setTimeout(startRound,2000);
   render();
  }
 }
}

connect();
</script>

</body>
</html>

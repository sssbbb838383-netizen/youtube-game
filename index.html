<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра для OBS - Полноэкранная версия</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 80px;
            box-sizing: border-box;
            background: rgba(15, 16, 28, 0.93);
            border: 8px solid #ffcc00;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
        }

        #category {
            font-size: 56px; 
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 3px 3px 6px #000;
            margin: 0;
        }

        #word-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 40px 0;
        }

        .letter-box {
            width: 90px;
            height: 110px;
            background: #ffffff;
            color: #111111;
            font-size: 64px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            box-shadow: 0 8px 0 #b3b3b3, 0 10px 20px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        .hidden-letter {
            background: #252836 !important;
            color: #252836 !important;
            border: 3px solid #45495e;
            box-shadow: inset 0 0 15px #000;
        }

        #instructions {
            font-size: 28px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 12px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            display: inline-block;
            align-self: center;
            text-shadow: 2px 2px 4px #000;
        }

        #leaderboard {
            margin-top: 40px;
            border-top: 4px solid #333;
            padding-top: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .leaderboard-title {
            color: #ff4757;
            font-weight: bold;
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
            text-shadow: 2px 2px 4px #000;
        }

        #leaderboard-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 40px;
        }

        .score-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 25px;
            border-radius: 12px;
            border-left: 6px solid #ffcc00;
            font-size: 26px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .score-entry span:first-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 600px;
        }

        .score-entry span:last-child {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="category">Загрузка...</div>
        
        <div id="word-display"></div>
        
        <div id="instructions">💬 Команды для чата: !б [буква] или !слово [слово]</div>
        
        <div id="leaderboard">
            <div class="leaderboard-title">🏆 ТОП-10 ИГРОКОВ РАУНДА:</div>
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>

    <script>
        // ВСТАВЬТЕ СЮДА ID ВАШЕГО СТРИМА ПОСЛЕ НАЧАЛА СТРИМА
        const YOUTUBE_VIDEO_ID = ""; 

        const WORDS_DATABASE = [
            { word: "АРБУЗ", category: "Еда / Ягода" },
            { word: "СТРИМЕР", category: "Профессия" },
            { word: "НОУТБУК", category: "Техника" },
            { word: "КОСМОС", category: "Наука" },
            { word: "ПОДПИСЧИК", category: "Человек на стриме" },
            { word: "ТЕЛЕФОН", category: "Гаджет" },
            { word: "ФУТБОЛ", category: "Спорт" },
            { word: "ЖИРАФ", category: "Животное" }
        ];

        let currentWordObj = {};
        let guessedLetters = [];
        let scores = {};

        function initNewRound() {
            currentWordObj = WORDS_DATABASE[Math.floor(Math.random() * WORDS_DATABASE.length)];
            guessedLetters = [];
            document.getElementById("category").innerText = `Категория: ${currentWordObj.category}`;
            renderWord();
            updateLeaderboard();
        }

        function renderWord() {
            const container = document.getElementById("word-display");
            container.innerHTML = "";

            for (let char of currentWordObj.word) {
                const box = document.createElement("div");
                box.classList.add("letter-box");

                if (guessedLetters.includes(char)) {
                    box.innerText = char;
                } else {
                    box.classList.add("hidden-letter");
                    box.innerText = "?";
                }
                container.appendChild(box);
            }
        }

        function processGameMessage(user, msg) {
            msg = msg.trim().toUpperCase();

            if (msg.startsWith("!Б ")) {
                let letter = msg.replace("!Б ", "").trim().substring(0, 1);
                if (!letter) return;

                if (currentWordObj.word.includes(letter) && !guessedLetters.includes(letter)) {
                    guessedLetters.push(letter);
                    scores[user] = (scores[user] || 0) + 10;
                    renderWord();
                    updateLeaderboard();
                    checkWin();
                }
            }

            if (msg.startsWith("!СЛОВО ")) {
                let guessedWord = msg.replace("!СЛОВО ", "").trim();
                if (guessedWord === currentWordObj.word) {
                    scores[user] = (scores[user] || 0) + 50;
                    guessedLetters = currentWordObj.word.split("");
                    renderWord();
                    updateLeaderboard();
                    
                    document.getElementById("instructions").innerText = `🎉 ${user} угадал слово целиком!`;
                    setTimeout(() => {
                        document.getElementById("instructions").innerText = "💬 Команды для чата: !б [буква] или !слово [слово]";
                        initNewRound();
                    }, 4000);
                }
            }
        }

        function checkWin() {
            let isWin = true;
            for (let char of currentWordObj.word) {
                if (!guessedLetters.includes(char)) isWin = false;
            }
            if (isWin) {
                document.getElementById("instructions").innerText = "🎉 Слово разгадано! Новый раунд...";
                setTimeout(() => {
                    document.getElementById("instructions").innerText = "💬 Команды для чата: !б [буква] или !слово [слово]";
                    initNewRound();
                }, 4000);
            }
        }

        function updateLeaderboard() {
            const list = document.getElementById("leaderboard-list");
            list.innerHTML = "";
            
            let sorted = Object.entries(scores).sort((a, b) => b - a).slice(0, 10); 
            
            if (sorted.length === 0) {
                list.style.display = "block";
                list.innerHTML = '<div style="color: #888; font-style: italic; font-size: 24px; text-align: center;">Ожидание ходов зрителей...</div>';
                return;
            }
            
            list.style.display = "grid";
            sorted.forEach(([player, score], index) => {
                const entry = document.createElement("div");
                entry.classList.add("score-entry");
                entry.innerHTML = `<span>${index + 1}. 👤 ${player}</span><span>${score} XP</span>`;
                list.appendChild(entry);
            });
        }

        function startChatListener() {
            if (!YOUTUBE_VIDEO_ID) return;
            try {
                const liveChat = new YouTubeChat.LiveChat({ liveId: YOUTUBE_VIDEO_ID });
                liveChat.on("chat", (chatItem) => {
                    if (chatItem && chatItem.author && chatItem.message) {
                        const user = chatItem.author.name;
                        const message = chatItem.message.map(m => m.text || "").join("");
                        processGameMessage(user, message);
                    }
                });
                liveChat.start().catch(err => console.error(err));
            } catch (e) { console.error(e); }
        }

        initNewRound();
        startChatListener();
    </script>
</body>
</html>

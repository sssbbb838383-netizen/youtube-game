<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OBS Game - Fixed Edition</title>
<style>
body {
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:'Arial Black', sans-serif;
    color:white;
    width: 1920px;
    height: 1080px;
    box-sizing: border-box;
    position: relative;
}
#leaderboard {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 380px;
    height: 1000px;
    background: rgba(15, 16, 28, 0.96);
    padding: 30px 20px;
    border-radius: 25px;
    border: 4px solid #ff4757;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
    box-sizing: border-box;
}
.leaderboard-title {
    color: #ff4757;
    font-weight: bold;
    font-size: 28px;
    margin-bottom: 25px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
}
#lb {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.score-entry {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 12px 18px;
    border-radius: 12px;
    border-left: 5px solid #ff4757;
    font-size: 20px;
}
.score-entry span:last-child {
    color: #00ffcc;
    font-weight: bold;
}
#game {
    position: absolute;
    left: 50%;
    top: 55%; 
    transform: translate(-50%, -50%);
    text-align: center;
    background: rgba(15, 16, 28, 0.96);
    padding: 45px;
    border-radius: 25px;
    border: 4px solid #ffcc00;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
    width: 960px; 
    box-sizing: border-box;
}
#category {
    font-size: 38px; 
    color: #ffcc00;
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 2px;
}
#word {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 35px;
    flex-wrap: wrap;
    min-height: 75px;
}
.letter {
    width: 65px;
    height: 75px;
    background: #ffffff;
    color: #111111;
    font-size: 46px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    box-shadow: 0 6px 0 #b3b3b3;
    text-transform: uppercase;
}
.hidden {
    background: #252836 !important;
    color: #00ffcc !important; 
    border: 2px solid #45495e;
    box-shadow: inset 0 0 10px #000;
}
#instructions {
    font-size: 20px;
    color: #00ffcc;
    background: rgba(0, 0, 0, 0.5);
    padding: 12px 20px;
    border-radius: 10px;
}
#rules-container {
    position: absolute;
    right: 40px;
    top: 40px;
    width: 440px;
    height: 1000px;
    background: rgba(15, 16, 28, 0.96);
    padding: 40px 25px;
    border-radius: 25px;
    border: 4px solid #00f0ff;
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
    box-sizing: border-box;
}
.rules-title {
    color: #00f0ff;
    font-weight: bold;
    font-size: 38px;
    margin-bottom: 40px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 3px;
}
.rule-item {
    background: rgba(255, 255, 255, 0.04);
    padding: 24px;
    border-radius: 16px;
    margin-bottom: 25px;
    border-left: 6px solid #00f0ff;
    font-size: 24px;
    line-height: 1.6;
}
.rule-cmd {
    color: #ffcc00;
    font-weight: bold;
    background: rgba(0,0,0,0.4);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 26px;
    display: inline-block;
    margin-top: 5px;
}
</style>
</head>
<body>

<div id="leaderboard">
    <div class="leaderboard-title">🏆 ТОП ИГРОКОВ</div>
    <div id="lb"></div>
</div>

<div id="game">
    <div id="category">Ожидание подключения...</div>
    <div id="word"></div>
    <div id="instructions">💬 Пиши в чат команды ниже, чтобы играть!</div>
</div>

<div id="rules-container">
    <div class="rules-title">📜 ПРАВИЛА</div>
    <div class="rule-item">В чате загадано секретное животное. Открой его быстрее всех!</div>
    <div class="rule-item">Угадать <b>БУКВУ</b>: <br><span class="rule-cmd">!б [буква]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !б а</small></div>
    <div class="rule-item">Угадать <b>ВСЁ СЛОВО</b>: <br><span class="rule-cmd">!слово [слово]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !слово жираф</small></div>
</div>

<script>
// Настройки WebSocket для связи со Streamer.bot
const WS_URL = "ws://127.0.0.1:4455/"; 

let ws;
let word = "";
let guessed = [];
let scores = {};
let category = "";

const WORDS = [
    ["ЖИРАФ", "Животное: Саванна"], ["ЛЕОПАРД", "Животное: Хищник"], ["МЕДВЕДЬ", "Животное: Лес"], ["ОБЕЗЬЯНА", "Животное: Джунгли"], ["КЕНГУРУ", "Животное: Австралия"],
    ["СЛОН", "Животное: Саванна"], ["ТИГР", "Животное: Хищник"], ["ПАНДА", "Животное: Азия"], ["ВОЛК", "Животное: Хищник"], ["ЛИСА", "Животное: Лес"],
    ["ЗАЯЦ", "Животное: Лес"], ["БЕГЕМОТ", "Животное: Африка"], ["НОСОРОГ", "Животное: Африка"], ["ЗЕБРА", "Животное: Саванна"], ["ГЕПАРД", "Животное: Скорость"]
];

function connect() {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        document.getElementById("instructions").innerText = "💬 Бот успешно подключен! Игра начинается.";
        startRound();
    };

    ws.onmessage = (msg) => {
        try {
            let data = JSON.parse(msg.data);
            if (data.event === "chat" && data.user && data.message) {
                handleChat(data.user, data.message);
            }
        } catch(e){}
    };

    ws.onclose = () => {
        document.getElementById("category").innerText = "Подключение потеряно...";
        setTimeout(connect, 2000);
    };
}

function startRound() {
    let w = WORDS[Math.floor(Math.random() * WORDS.length)];
    word = w[0];      
    category = w[1];  
    guessed = [];

    document.getElementById("category").innerText = category;
    renderWord();
}

function renderWord() {
    let div = document.getElementById("word");
    div.innerHTML = "";

    for (let c of word) {
        let el = document.createElement("div");
        el.className = "letter";

        if (!guessed.includes(c)) {
            el.classList.add("hidden");
            el.innerText = "_"; 
        } else {
            el.innerText = c;
        }
        div.appendChild(el);
    }
}

function handleChat(user, msg) {
    let upperMsg = msg.toUpperCase().trim();

    if (upperMsg.startsWith("!Б")) {
        let parts = upperMsg.split(" ");
        if (parts.length < 2) return; 
        
        let l = parts[1].trim().substring(0, 1); 
        if (!l) return;

        if (guessed.includes(l)) return;

        if (word.includes(l)) {
            guessed.push(l);
            addScore(user, 10);
            renderWord();
            checkWin();
        }
    }

    if (upperMsg.startsWith("!СЛОВО ")) {
        let w = upperMsg.replace("!СЛОВО ", "").trim();

        if (w === word) {
            guessed = word.split("");
            addScore(user, 50);
            renderWord();
            document.getElementById("instructions").innerText = `🎉 ${user} угадал всё слово целиком! (+50 XP)`;
            setTimeout(() => {
                document.getElementById("instructions").innerText = "💬 Пиши в чат команды ниже, чтобы играть!";
                startRound();
            }, 4000);
        }
    }
}

function checkWin() {
    let isWin = true;
    for (let c of word) {
        if (!guessed.includes(c)) isWin = false;
    }
    if (isWin) {
        document.getElementById("instructions").innerText = "🎉 Раунд завершен! Загадываем следующее животное...";
        setTimeout(() => {
            document.getElementById("instructions").innerText = "💬 Пиши в чат команды ниже, чтобы играть!";
            startRound();
        }, 4000);
    }
}

function addScore(user, pts) {
    scores[user] = (scores[user] || 0) + pts;
    updateLB();
}

function updateLeaderboardSlots() {
    let list = document.getElementById("lb");
    list.innerHTML = "";
    for (let i = 1; i <= 10; i++) {
        let entry = document.createElement("div");
        entry.className = "score-entry";
        entry.style.opacity = "0.3";
        entry.innerHTML = `<span>${i}. 👤 Свободно</span><span>0 XP</span>`;
        list.appendChild(entry);
    }
}

function updateLB() {
    let arr = Object.entries(scores).sort((a,b) => b[1] - a[1]).slice(0,10);
    let list = document.getElementById("lb");
    list.innerHTML = "";

    arr.forEach((x, i) => {
        let entry = document.createElement("div");
        entry.className = "score-entry";
        entry.innerHTML = `<span>${i+1}. 👤 ${x[0]}</span><span>${x[1]} XP</span>`; 
        list.appendChild(entry);
    });

    if (arr.length < 10) {
        for (let i = arr.length + 1; i <= 10; i++) {
            let entry = document.createElement("div");
            entry.className = "score-entry";
            entry.style.opacity = "0.3";
            entry.innerHTML = `<span>${i}. 👤 Свободно</span><span>0 XP</span>`;
            list.appendChild(entry);
        }
    }
}

updateLeaderboardSlots();
connect();
</script>

</body>
</html>

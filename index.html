<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра для OBS - 100% Стабильная</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            box-sizing: border-box;
            position: relative;
        }

        /* 1. ЗОНА СЛЕВА: ТОП-10 */
        #leaderboard {
            position: absolute;
            left: 40px;
            top: 40px;
            width: 380px;
            height: 1000px;
            background: rgba(15, 16, 28, 0.96);
            padding: 30px 20px;
            border-radius: 25px;
            border: 4px solid #ff4757;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .leaderboard-title {
            color: #ff4757;
            font-weight: bold;
            font-size: 28px;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        #leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .score-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 12px;
            border-left: 5px solid #ff4757;
            font-size: 20px;
        }

        .score-entry span:last-child {
            color: #00ffcc;
            font-weight: bold;
        }

        /* 2. ЗОНА ПО ЦЕНТРУ: ИГРА */
        #game-container {
            position: absolute;
            left: 50%;
            top: 55%; 
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 16, 28, 0.96);
            padding: 45px;
            border-radius: 25px;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
            width: 940px; 
            box-sizing: border-box;
        }

        #category {
            font-size: 38px; 
            color: #ffcc00;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        #word-display {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .letter-box {
            width: 65px;
            height: 75px;
            background: #ffffff;
            color: #111111;
            font-size: 46px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 6px 0 #b3b3b3;
            text-transform: uppercase;
        }

        .hidden-letter {
            background: #252836 !important;
            color: #252836 !important;
            border: 2px solid #45495e;
            box-shadow: inset 0 0 10px #000;
        }

        #instructions {
            font-size: 20px;
            color: #00ffcc;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 20px;
            border-radius: 10px;
        }

        /* 3. ЗОНА СПРАВА: ПРАВИЛА */
        #rules-container {
            position: absolute;
            right: 40px;
            top: 40px;
            width: 440px;
            height: 1000px;
            background: rgba(15, 16, 28, 0.96);
            padding: 40px 25px;
            border-radius: 25px;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
        }

        .rules-title {
            color: #00f0ff;
            font-weight: bold;
            font-size: 38px;
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px #000;
        }

        .rule-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 25px;
            border-left: 6px solid #00f0ff;
            font-size: 24px;
            line-height: 1.6;
        }
        
        .rule-cmd {
            color: #ffcc00;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 26px;
            display: inline-block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="leaderboard">
        <div class="leaderboard-title">🏆 ТОП ИГРОКОВ</div>
        <div id="leaderboard-list"></div>
    </div>

    <div id="game-container">
        <div id="category">Категория...</div>

        <div class="rule-item">Угадать <b>ВСЁ СЛОВО</b>: <br><span class="rule-cmd">!слово [животное]</span> <br><small style="color: #aaa; font-size: 16px;">Пример: !слово жираф</small></div>
        <div class="rule-item">Набирай очки и возглавь общий рейтинг стрима!</div>
    </div>

    <script src="https://jsdelivr.net"></script>

    <script>

            { word: "ЗАЯЦ", category: "Животное: Лес" }, { word: "БЕГЕМОТ", category: "Животное: Река" }, { word: "НОСОРОГ", category: "Животное: Африка" }, { word: "ЗЕБРА", category: "Животное: Саванна" }, { word: "ГЕПАРД", category: "Животное: Хищник" },
            { word: "ГИЕНА", category: "Животное: Хищник" }, { word: "ПУМА", category: "Животное: Горы" }, { word: "ЯГУАР", category: "Животное: Хищник" }, { word: "РЫСЬ", category: "Животное: Хищник" }, { word: "КАБАН", category: "Животное: Лес" },

                updateLeaderboard();

                } else {
